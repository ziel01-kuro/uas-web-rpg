<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Battle — RPG Turn-Based</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: linear-gradient(180deg, #6fb8d9 0%, #a8d9e8 55%, #c9e8c0 100%);
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    .nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav a,
    .nav button {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      padding: 8px 12px;
      background: #3a2a1a;
      color: #fff2d6;
      border: 2px solid #000;
      box-shadow: 0 2px 0 #000;
      text-decoration: none;
      cursor: pointer;
    }

    .box {
      width: 500px;
      max-width: 100%;
      padding: 22px;
      /* background-image: url('/static/ui/action_panel.png'); */
      background-size: cover;
      background-color: rgba(15, 8, 20, 0.72);
      background-blend-mode: multiply;
      border: 3px solid #000;
      box-shadow: 0 0 0 2px #6b4a2a;
      color: #fff2d6;
    }

    h1 {
      font-size: 0.7rem;
      text-align: center;
      margin-bottom: 6px;
    }

    h1.win {
      color: #a8e0b8;
    }

    h1.lose {
      color: #ff8a8a;
    }

    .meta {
      text-align: center;
      font-size: 0.4rem;
      color: #d8c9a8;
      margin-bottom: 18px;
    }

    .log-entry {
      font-size: 0.45rem;
      padding: 8px;
      margin-bottom: 6px;
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid #6b4a2a;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="nav">
    <a href="/">Battle</a>
    <a href="/profile">Profil</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/history">Riwayat</a>
    <button onclick="doLogout()">Logout</button>
  </div>

  <div class="box">
    <h1 class="{{ 'win' if battle.winner == 'player' else 'lose' }}">
      {{ 'MENANG' if battle.winner == 'player' else 'KALAH' }}
    </h1>
    <div class="meta">{{ battle.turns_taken }} aksi · {{ battle.played_at.strftime('%d %b %Y %H:%M') }}</div>
    {% for l in logs %}
    <div class="log-entry">{{ l.message }}</div>
    {% endfor %}
  </div>

  <script>
    async function doLogout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }
  </script>
</body>

</html>
